<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle"></title>
    <link rel="stylesheet" href="..\..\style.css">
  </head>
  <body>
    <h1>漢検8級勉強</h1>
    <h2 id="pageSubtitle"></h2>

    <div id="linkContainer"></div>
    
    <br><br>
    <a href="..\..\index8.html">戻る</a>
    
    <script>
      const params = new URLSearchParams(location.search);
      const cat = parseInt(params.get('cat')) || 0;
      const sel = parseInt(params.get('sel')) || 0;
      const seed = parseInt(params.get('num')) || 0;
      const cats = [
        "読み","筆順","対義語","部首","同音書き","送り仮名","音訓読み","書き"
      ];
      const sels = [
        "甲子","乙丑","丙寅","丁卯","戊辰","己巳","庚午","辛未","壬申","癸酉",
        "甲戌","乙亥","丙子","丁丑","戊寅","己卯","庚辰","辛巳","壬午","癸未",
        "甲申","乙酉","丙戌","丁亥","戊子","己丑","庚寅","辛卯","壬辰","癸巳",
        "甲午","乙未","丙申","丁酉","戊戌","己亥","庚子","辛丑","壬寅","癸卯",
        "甲辰","乙巳","丙午","丁未","戊申","己酉","庚戌","辛亥","壬子","癸丑",
        "甲寅","乙卯","丙辰","丁巳","戊午","己未","庚申","辛酉","壬戌","癸亥",
      ];
      const titles = [
        "立春","雨水","啓蟄","春分","清明","穀雨",
        "立夏","小満","芒種","夏至","小暑","大暑",
        "立秋","処暑","白露","秋分","寒露","霜降",
        "立冬","小雪","大雪","冬至","小寒","大寒"
      ];

      const KEY8_8 = "result8_8";
      const COUNT8 = 10;

      // localStorageから取得
      let val8 = localStorage.getItem(KEY8_8);
      let sts8;
      if (val8 === null){
        sts8 = "0".repeat(COUNT8);
      } else {
        sts8 = String(val8);
        if (sts8.length < COUNT8){
          sts8 += "0".repeat(COUNT8 - sts8.length);
        }
      }
      localStorage.setItem(KEY8_8, sts8);
      
      // タイトル反映
      const titleText = `漢検8級勉強　${cats[cat]}【${sels[sel]}】`;
      document.getElementById('pageTitle').textContent = titleText;
      document.getElementById('pageSubtitle').textContent = `${cats[cat]}【${sels[sel]}】`;
    
      const container = document.getElementById('linkContainer');
    
      for (const [index, title] of titles.entries()) {
        // 書き
        if (cat == 7) {
          if (((sel * (24 * 10)) + ((index + 1) * 10)) > COUNT8) {
            break;
          }
        }

        const link = document.createElement('a');
        link.href = `quiz8.html?cat=${cat}&sel=${sel}&page=${index}&seed=${seed}`;
        link.textContent = title;
    
        container.appendChild(link);
        container.append('　'); // 全角スペース
    
        // 6個ごとに改行
        if ((index + 1) % 6 === 0) {
          container.appendChild(document.createElement('br'));
          container.appendChild(document.createElement('br'));
        }
      }
    </script>
  </body>
</html>
