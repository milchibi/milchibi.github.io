<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検 分野別勉強</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>漢検1級 分野別勉強</h1>
    <h2>一．読み（音読み）</h2>

    <h3>■ランダム用シード値</h3>
    <input type="number" id="seed" name="seed" min="0" max="9999" step="1" value="0" placeholder="0～9999"><br>
    ※0:オリジナル順、1～9999:固定ランダム<br>
    
    <h3>■出題数選択</h3>
    <select id="mySelect">
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="30">30</option>
    </select>
    
    <h3>■出題理解度選択</h3>
    <label><input type="checkbox" name="groupA" value="1" checked><span class="c0">■　</span></label>
    <label><input type="checkbox" name="groupA" value="2"><span class="c1">■　</span></label>
    <label><input type="checkbox" name="groupA" value="4"><span class="c2">■　</span></label>
    <label><input type="checkbox" name="groupA" value="8"><span class="c3">■</span></label><br>
    ※黒:未回答、緑:自身あり、黄:自信なし、赤:不正解（ブラウザごとに理解度を保存）<br>

    <h3>■出題範囲選択</h3>
    <label><input type="checkbox" name="groupB" value="1" checked>逞筆◆１</label><br>
    <label><input type="checkbox" name="groupB" value="2">逞筆◆２</label><br>
    <label><input type="checkbox" name="groupB" value="4">逞筆◆３</label><br>
    <label><input type="checkbox" name="groupB" value="8">逞筆◆４</label><br>
    <label><input type="checkbox" name="groupB" value="16">逞筆◆５</label>

    <br><br>
    <button onclick="getSelections()">問題一覧生成</button>

    <div id="result"></div>
    
    <br><br>
    <a href="top_test.html">分野選択に戻る</a>

    <script>
      // 出題理解度
      const DEF_COMP = {
          C0: 1,
          C1: 2,
          C2: 4,
          C3: 8
      };
      // 出題範囲
      const DEF_SEL = {
          S1: 1,
          S2: 2,
          S3: 4,
          S4: 8,
          S5: 16
      };

      // localStorageの初期化
      function getStatus(key, count) {
        let value = localStorage.getItem(key);
        let status;
        if (value === null) {
          status = "0".repeat(count);
        } else {
          status = String(value);
          // 短ければ0で補う
          if (status.length < count) {
            status += "0".repeat(count - status.length);
          }
          // 長ければ切る
          if (status.length > count) {
            status = status.substring(0, count);
          }
        }
        localStorage.setItem(key, status);
        return status;
      }
      // localStorageを初期化
      const status = getStatus("result11", 4521);
      
      // ボタンクリック時のアクション
      function getSelections() {
        // ランダム用シード値
        const seed = Number(document.getElementById("seed").value);
        // シード値チェック
        if (!Number.isInteger(seed) || seed < 0 || seed > 9999) {
            alert("シード値は0～9999の整数を入力してください。");
            return;
        }

        // 出題数選択の選択値取得
        const num = Number(document.getElementById("mySelect").value);
          
        // 出題理解度選択のビットフラグ取得
        const selectedA = Array.from(
            document.querySelectorAll('input[name="groupA"]:checked')
        ).reduce((sum, el) => sum + Number(el.value),0);
        // 選択チェック
        if (selectedA === 0) {
            alert("出題理解度選択から最低1つ選択してください。");
            return;
        }
    
        // 出題範囲選択のビットフラグ取得
        const selectedB = Array.from(
            document.querySelectorAll('input[name="groupB"]:checked')
        ).reduce((sum, el) => sum + Number(el.value),0);
        // 選択チェック
        if (selectedB === 0) {
            alert("出題範囲選択から最低1つ選択してください。");
            return;
        }
        
        // パラメータとして取得
        const params = {
            seed: seed,
            num: num,
            comp: selectedA,
            sel: selectedB
        };
    
        // 確認用
        //alert(JSON.stringify(params));


        // CSV読み込み
        const filename = "data_11.csv";

        fetch(filename)
          .then(res => {
            if (!res.ok) {
              throw new Error(`CSV読み込み失敗: ${res.status} ${filename}`);
            }
            return res.text();
          })
          .then(csv => {

            // CSVを配列化
            const data = csv.replace(/^\uFEFF/, "")
                            .trimEnd()
                            .split(/\r?\n/)
                            .map(line => line.split(","));

            // 該当する問題の行番号
            const matchedRows = [];

            // CSVの各行をチェック
            data.forEach((row, index) => {

              // localStorageの理解度を取得
              const comp = Number(status[index]);

              // 出題理解度の判定
              // 0 → 1、1 → 2、2 → 4、3 → 8
              const compFlag = 1 << comp;

              if ((selectedA & compFlag) === 0) {
                return;
              }

              // CSVの1列目から出題範囲を取得
              const category = row[0].trim();

              // 出題範囲のビットフラグ
              const categoryFlags = {
                "逞筆◆１": 1,
                "逞筆◆２": 2,
                "逞筆◆３": 4,
                "逞筆◆４": 8,
                "逞筆◆５": 16
              };

              const categoryFlag = categoryFlags[category];

              // 出題範囲の判定
              if (!categoryFlag || (selectedB & categoryFlag) === 0) {
                return;
              }

              // 両方の条件に合致した行番号を格納
              matchedRows.push(index + 1);

            });

            // 結果を表示
            const resultArea = document.getElementById("result");

            resultArea.innerHTML = "";

            const title = document.createElement("h3");
            title.textContent = "■該当問題一覧";
            resultArea.appendChild(title);

            const count = document.createElement("p");
            count.textContent = "該当問題数：" + matchedRows.length;
            resultArea.appendChild(count);

            const list = document.createElement("p");
            list.textContent = matchedRows.join(", ");
            resultArea.appendChild(list);

          })
          .catch(error => {
            alert(error.message);
          });

      }
    </script>
  </body>
</html>
