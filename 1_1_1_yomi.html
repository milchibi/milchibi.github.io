
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検 分野別勉強</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>漢検1級 分野別勉強</h1>
    <h2>一．読み（音読み）</h2>

    <h3>■ランダム用シード値</h3>
    <input type="number" id="seed" name="seed"
        min="0" max="9999" step="1" value="0"
        placeholder="0～9999"><br>
    ※0:オリジナル順、1～9999:固定ランダム<br>

    <h3>■出題数選択</h3>
    <select id="mySelect">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="30">30</option>
    </select>

    <h3>
        ■出題理解度選択
        <span id="compCounts"></span>
    </h3>

    <label>
        <input type="checkbox" name="groupA" value="1" checked>
        <span class="c0">■　</span>
    </label>
    <label>
        <input type="checkbox" name="groupA" value="2">
        <span class="c1">■　</span>
    </label>
    <label>
        <input type="checkbox" name="groupA" value="4">
        <span class="c2">■　</span>
    </label>
    <label>
        <input type="checkbox" name="groupA" value="8">
        <span class="c3">■</span>
    </label><br>

    ※黒:未回答、緑:自身あり、黄:自信なし、赤:不正解
    （ブラウザごとに理解度を保存）<br>

    <h3>■出題範囲選択</h3>

    <label>
        <input type="checkbox" name="groupB" value="1" checked>
        逞筆◆１
    </label><br>

    <label>
        <input type="checkbox" name="groupB" value="2">
        逞筆◆２
    </label><br>

    <label>
        <input type="checkbox" name="groupB" value="4">
        逞筆◆３
    </label><br>

    <label>
        <input type="checkbox" name="groupB" value="8">
        逞筆◆４
    </label><br>

    <label>
        <input type="checkbox" name="groupB" value="16">
        逞筆◆５
    </label>

    <br><br>

    <button onclick="getSelections()">問題一覧生成</button>

    <div id="result"></div>

    <br><br>
    <a href="top_test.html">分野選択に戻る</a>

    <script>

        // 出題理解度
        const DEF_COMP = {
            C0: 1,
            C1: 2,
            C2: 4,
            C3: 8
        };

        // 出題範囲
        const DEF_SEL = {
            S1: 1,
            S2: 2,
            S3: 4,
            S4: 8,
            S5: 16
        };

        // localStorageのキー
        const STORAGE_KEY = "result11";

        // 理解度データ
        let status = {};

        // 集計用CSVデータ
        let csvDataForCounts = null;

        // 出題範囲のビットフラグ
        const categoryFlags = {
            "逞筆◆１": 1,
            "逞筆◆２": 2,
            "逞筆◆３": 4,
            "逞筆◆４": 8,
            "逞筆◆５": 16
        };


        // localStorageの初期化・取得
        function getStatus(key, data) {

            let value = localStorage.getItem(key);
            let result = {};

            if (value !== null) {

                try {

                    result = JSON.parse(value);

                    if (
                        typeof result !== "object" ||
                        result === null ||
                        Array.isArray(result)
                    ) {
                        result = {};
                    }

                } catch (e) {
                    result = {};
                }
            }

            // CSVに存在する問題IDを初期化
            data.forEach(row => {

                const id = String(row[2] ?? "").trim();

                if (id === "") {
                    return;
                }

                if (
                    !Object.prototype.hasOwnProperty.call(result, id)
                ) {
                    result[id] = 0;
                }

                // 理解度の値をチェック
                if (![0, 1, 2, 3].includes(result[id])) {
                    result[id] = 0;
                }

            });

            // localStorageに保存
            localStorage.setItem(
                key,
                JSON.stringify(result)
            );

            return result;
        }


        // 理解度の更新
        function updateStatus(id, value) {

            id = String(id);

            if (![0, 1, 2, 3].includes(value)) {
                return;
            }

            status[id] = value;

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(status)
            );

            // 理解度別問題数を更新
            if (csvDataForCounts !== null) {
                updateCounts(csvDataForCounts);
            }
        }


        // 理解度別の問題数を集計
        function updateCounts(data) {

            // 選択中の出題範囲を取得
            const selectedB = Array.from(
                document.querySelectorAll(
                    'input[name="groupB"]:checked'
                )
            ).reduce(
                (sum, el) => sum + Number(el.value),
                0
            );

            // 理解度別の件数
            const counts = [0, 0, 0, 0];

            data.forEach(row => {

                const category = row[0].trim();

                const id = String(row[2] ?? "").trim();

                if (id === "") {
                    return;
                }

                const categoryFlag =
                    categoryFlags[category];

                // 出題範囲の判定
                if (
                    !categoryFlag ||
                    (selectedB & categoryFlag) === 0
                ) {
                    return;
                }

                // 問題IDから理解度を取得
                const comp = status[id];

                if (
                    Number.isInteger(comp) &&
                    comp >= 0 &&
                    comp <= 3
                ) {
                    counts[comp]++;
                }

            });

            // 表示更新
            const area =
                document.getElementById("compCounts");

            area.innerHTML = "";

            counts.forEach((count, index) => {

                const item =
                    document.createElement("span");

                const color =
                    document.createElement("span");

                color.className = "c" + index;
                color.textContent = "■";

                item.appendChild(color);

                item.appendChild(
                    document.createTextNode(" " + count + "　")
                );

                area.appendChild(item);

            });

        }


        // ボタンクリック時のアクション
        function getSelections() {

            // ランダム用シード値
            const seed = Number(
                document.getElementById("seed").value
            );

            // シード値チェック
            if (
                !Number.isInteger(seed) ||
                seed < 0 ||
                seed > 9999
            ) {
                alert("シード値は0～9999の整数を入力してください。");
                return;
            }

            // 出題数選択
            const num = Number(
                document.getElementById("mySelect").value
            );

            // 出題理解度選択のビットフラグ取得
            const selectedA = Array.from(
                document.querySelectorAll(
                    'input[name="groupA"]:checked'
                )
            ).reduce(
                (sum, el) => sum + Number(el.value),
                0
            );

            if (selectedA === 0) {
                alert("出題理解度選択から最低1つ選択してください。");
                return;
            }

            // 出題範囲選択のビットフラグ取得
            const selectedB = Array.from(
                document.querySelectorAll(
                    'input[name="groupB"]:checked'
                )
            ).reduce(
                (sum, el) => sum + Number(el.value),
                0
            );

            if (selectedB === 0) {
                alert("出題範囲選択から最低1つ選択してください。");
                return;
            }

            // パラメータ
            const params = {
                seed: seed,
                num: num,
                comp: selectedA,
                sel: selectedB
            };

            // CSV読み込み
            const filename = "data_11.csv";

            fetch(filename)
                .then(res => {

                    if (!res.ok) {
                        throw new Error(
                            `CSV読み込み失敗: ${res.status} ${filename}`
                        );
                    }

                    return res.text();

                })
                .then(csv => {

                    // CSVを配列化
                    const data = csv
                        .replace(/^\uFEFF/, "")
                        .trimEnd()
                        .split(/\r?\n/)
                        .map(line => line.split(","));

                    // 問題IDをキーとする理解度データ取得
                    status = getStatus(STORAGE_KEY, data);

                    // 集計用データを更新
                    csvDataForCounts = data;

                    // 全件に元の行番号を付与
                    const allData = data.map((row, index) => ({
                        row: row,
                        index: index
                    }));

                    // シード値が0以外なら全件をシャッフル
                    if (seed !== 0) {
                        seededShuffle(allData, seed);
                    }

                    // 該当する問題の行番号
                    const matchedRows = [];

                    // シャッフル後の全件をチェック
                    allData.forEach(item => {

                        const row = item.row;

                        const originalIndex = item.index;

                        // CSVの3列目から問題IDを取得
                        const id = String(row[2] ?? "").trim();

                        if (id === "") {
                            return;
                        }

                        // 問題IDに対応する理解度を取得
                        const comp = status[id];

                        // 理解度のビットフラグ
                        // 0 → 1、1 → 2、2 → 4、3 → 8
                        const compFlag = 1 << comp;

                        // 出題理解度の判定
                        if ((selectedA & compFlag) === 0) {
                            return;
                        }

                        // CSVの1列目から出題範囲を取得
                        const category = row[0].trim();

                        const categoryFlag =
                            categoryFlags[category];

                        // 出題範囲の判定
                        if (
                            !categoryFlag ||
                            (selectedB & categoryFlag) === 0
                        ) {
                            return;
                        }

                        // 元のCSV行番号を格納
                        matchedRows.push(originalIndex + 1);

                    });

                    // 結果表示
                    const resultArea =
                        document.getElementById("result");

                    resultArea.innerHTML = "";

                    const title =
                        document.createElement("h3");

                    title.textContent = "■該当問題一覧";

                    resultArea.appendChild(title);

                    const count =
                        document.createElement("p");

                    count.textContent =
                        "該当問題数：" + matchedRows.length;

                    resultArea.appendChild(count);

                    // 出題数ごとに改行
                    for (
                        let i = 0;
                        i < matchedRows.length;
                        i += num
                    ) {

                        const list =
                            document.createElement("p");

                        list.textContent = matchedRows
                            .slice(i, i + num)
                            .join(", ");

                        resultArea.appendChild(list);

                    }

                })
                .catch(error => {
                    alert(error.message);
                });

        }


        // 乱数生成
        function mulberry32(seed) {

            return function() {

                let t = seed += 0x6D2B79F5;

                t = Math.imul(
                    t ^ (t >>> 15),
                    t | 1
                );

                t ^= t + Math.imul(
                    t ^ (t >>> 7),
                    t | 61
                );

                return (
                    (t ^ (t >>> 14)) >>> 0
                ) / 4294967296;

            };
        }


        // シード付きシャッフル
        function seededShuffle(array, seed) {

            const random = mulberry32(seed);

            // Fisher-Yatesシャッフル
            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j = Math.floor(
                    random() * (i + 1)
                );

                [array[i], array[j]] =
                    [array[j], array[i]];

            }

            return array;
        }


        // 初期表示・集計用CSV読み込み
        fetch("data_11.csv")
            .then(res => {

                if (!res.ok) {
                    throw new Error("CSV読み込み失敗");
                }

                return res.text();

            })
            .then(csv => {

                // CSVを配列化
                const data = csv
                    .replace(/^\uFEFF/, "")
                    .trimEnd()
                    .split(/\r?\n/)
                    .map(line => line.split(","));

                // 理解度データ取得
                status = getStatus(STORAGE_KEY, data);

                // 集計用データを保持
                csvDataForCounts = data;

                // 初期集計
                updateCounts(data);

            })
            .catch(error => {
                console.error(error);
            });


        // 出題範囲のチェック変更時に集計
        document.querySelectorAll(
            'input[name="groupB"]'
        ).forEach(el => {

            el.addEventListener("change", () => {

                if (csvDataForCounts !== null) {
                    updateCounts(csvDataForCounts);
                }

            });

        });

    </script>

</body>
</html>
