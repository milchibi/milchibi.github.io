<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検1級 分野別勉強</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="title">漢検1級 分野別勉強</p>

    ランダム用シード値　<input type="number" id="num" name="num" min="0" max="9999" step="1" value="0" placeholder="0～9999">
    <br><br>

    <mark>(一)　音読み</mark><br><br>
      <div id="linkContainer11"></div><br>
    <mark>(一)　訓読み</mark><br><br>
      <div id="linkContainer12"></div><br>
    <mark>(三)　語選択</mark><br><br>
      <div id="linkContainer3"></div><br>
    <mark>(五)　熟字訓・当て字</mark><br><br>
      <div id="linkContainer5"></div><br>

    <script>
      const KEY11 = "result11";
      const COUNT11 = 4200;
      const KEY12 = "result12";
      const COUNT12 = 1400;
      const KEY3 = "result3";
      const COUNT3 = 3786;
      const KEY5 = "result5";
      const COUNT5 = 2182;

      // 初期化
      if (localStorage.getItem(KEY11) === null) {
        localStorage.setItem(KEY11, "0".repeat(COUNT11));
      }
      if (localStorage.getItem(KEY12) === null) {
        localStorage.setItem(KEY12, "0".repeat(COUNT12));
      }
      if (localStorage.getItem(KEY3) === null) {
        localStorage.setItem(KEY3, "0".repeat(COUNT3));
      }
      if (localStorage.getItem(KEY5) === null) {
        localStorage.setItem(KEY5, "0".repeat(COUNT5));
      }

      // 干支
      const sels = [
        "甲子","乙丑","丙寅","丁卯","戊辰","己巳","庚午","辛未","壬申","癸酉",
        "甲戌","乙亥","丙子","丁丑","戊寅","己卯","庚辰","辛巳","壬午","癸未",
        "甲申","乙酉","丙戌","丁亥","戊子","己丑","庚寅","辛卯","壬辰","癸巳",
        "甲午","乙未","丙申","丁酉","戊戌","己亥","庚子","辛丑","壬寅","癸卯",
        "甲辰","乙巳","丙午","丁未","戊申","己酉","庚戌","辛亥","壬子","癸丑",
        "甲寅","乙卯","丙辰","丁巳","戊午","己未","庚申","辛酉","壬戌","癸亥",
      ];

      // シード値付きで遷移
      function addNumParameter(link, cat, index) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const num = document.getElementById("num").value;

          if (num === "" || num < 0 || num > 9999) {
            alert("シード値には、0～9999の数値を入力してください。");
            return;
          }

          location.href = `select.html?cat=${cat}&sel=${index}&num=${num}`;
        });
      }

      // リンク生成
      function createLinks(containerId, cat, total, unit) {
        const container = document.getElementById(containerId);

        // 必要なリンク数
        const count = Math.ceil(total / (24 * unit));

        for (let index = 0; index < count; index++) {

          const link = document.createElement("a");
          link.href = `select.html?cat=${cat}&sel=${index}`;
          link.textContent = sels[index];

          addNumParameter(link, cat, index);

          container.appendChild(link);
          container.append("　");

          // 6個ごとに改行
          if ((index + 1) % 6 === 0) {
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));
            }
        }
      }

      // 各分野の設定
      const categories = [
        { containerId: "linkContainer11", cat: 0, total: COUNT11, unit: 20 },
        { containerId: "linkContainer12", cat: 1, total: COUNT12, unit: 10 },
        { containerId: "linkContainer3",  cat: 4, total: COUNT3, unit: 5  },
        { containerId: "linkContainer5",  cat: 7, total: COUNT5, unit: 10 }
      ];

      // 一括生成
      categories.forEach(category => {
        createLinks(
          category.containerId,
          category.cat,
          category.total,
          category.unit
        );
      });
    </script>
  </body>
</html>
