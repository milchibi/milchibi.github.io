<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検7級 分野別勉強</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="title">漢検7級 分野別勉強</p>
    <div><a href="index.html">一級</a></div><br>
    <div><a href="index8.html">八級</a></div><br>

    ランダム用シード値　<input type="number" id="num" name="num" min="0" max="9999" step="1" value="0" placeholder="0～9999">
    <br><br>

    <mark>(一)　読み</mark>
      <div id="status1"></div><br>
      <div id="linkContainer1"></div><br>
    <mark>(十一)　書き</mark>
      <div id="status11"></div><br>
      <div id="linkContainer11"></div><br>

    <script>
      const KEY7_1 = "result7_1";
      const COUNT1 = 120;
      const KEY7_11 = "result7_11";
      const COUNT11 = 60;

      // 干支
      const sels = [
        "甲子","乙丑","丙寅","丁卯","戊辰","己巳","庚午","辛未","壬申","癸酉",
        "甲戌","乙亥","丙子","丁丑","戊寅","己卯","庚辰","辛巳","壬午","癸未",
        "甲申","乙酉","丙戌","丁亥","戊子","己丑","庚寅","辛卯","壬辰","癸巳",
        "甲午","乙未","丙申","丁酉","戊戌","己亥","庚子","辛丑","壬寅","癸卯",
        "甲辰","乙巳","丙午","丁未","戊申","己酉","庚戌","辛亥","壬子","癸丑",
        "甲寅","乙卯","丙辰","丁巳","戊午","己未","庚申","辛酉","壬戌","癸亥",
      ];

      // シード値付きで遷移
      function addNumParameter(link, cat, index) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const num = document.getElementById("num").value;

          if (num === "" || num < 0 || num > 9999) {
            alert("シード値には、0～9999の数値を入力してください。");
            return;
          }

          location.href = `select7.html?cat=${cat}&sel=${index}&num=${num}`;
        });
      }

      // リンク生成
      function createLinks(containerId, cat, total, unit) {
        const container = document.getElementById(containerId);

        // 必要なリンク数
        const count = Math.ceil(total / (24 * unit));

        for (let index = 0; index < count; index++) {

          const link = document.createElement("a");
          link.href = `select7.html?cat=${cat}&sel=${index}`;
          link.textContent = sels[index];

          addNumParameter(link, cat, index);

          container.appendChild(link);
          container.append("　");

          // 6個ごとに改行
          if ((index + 1) % 6 === 0) {
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));
            }
        }
      }

      // 各分野の設定
      const categories = [
        { containerId: "linkContainer1", cat: 0, total: COUNT1, unit: 20 },
        { containerId: "linkContainer11", cat: 10, total: COUNT11, unit: 20 },
      ];

      // 一括生成
      categories.forEach(category => {
        createLinks(
          category.containerId,
          category.cat,
          category.total,
          category.unit
        );
      });

      // localStorageから取得
      let val1 = localStorage.getItem(KEY7_1);
      let sts1;
      if(val1 === null){
        sts1 = "0".repeat(COUNT1);
      } else {
        sts1 = String(val1);
        if(sts1.length < COUNT1){
          sts1 += "0".repeat(COUNT1 - sts1.length);
        }
      }
      localStorage.setItem(KEY7_1, sts1);
      
      let val11 = localStorage.getItem(KEY7_11);
      let sts11;
      if(sts11 === null){
        sts11 = "0".repeat(COUNT11);
      } else {
        sts11 = String(val11);
        if(sts11.length < COUNT11){
          sts11 += "0".repeat(COUNT11 - sts11.length);
        }
      }
      localStorage.setItem(KEY7_11, sts11);
    
      // 0,1,2,3の数を数える
      const cnt1_0 = (sts1.match(/0/g) || []).length;
      const cnt1_1 = (sts1.match(/1/g) || []).length;
      const cnt1_2 = (sts1.match(/2/g) || []).length;
      const cnt1_3 = (sts1.match(/3/g) || []).length;
      const cnt11_0 = (sts11.match(/0/g) || []).length;
      const cnt11_1 = (sts11.match(/1/g) || []).length;
      const cnt11_2 = (sts11.match(/2/g) || []).length;
      const cnt11_3 = (sts11.match(/3/g) || []).length;
    
      // 表示
      document.getElementById("status1").innerHTML = 
        '<span class="c0">⬛︎</span>' + cnt1_0 + '　<span class="c1">⬛︎</span>' + cnt1_1 + '　<span class="c2">⬛︎</span>' + cnt1_2 + '　<span class="c3">⬛︎</span>' + cnt1_3;
      document.getElementById("status11").innerHTML = 
        '<span class="c0">⬛︎</span>' + cnt11_0 + '　<span class="c1">⬛︎</span>' + cnt11_1 + '　<span class="c2">⬛︎</span>' + cnt11_2 + '　<span class="c3">⬛︎</span>' + cnt11_3;
    </script>
  </body>
</html>
