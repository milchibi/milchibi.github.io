<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle"></title>
    <link rel="stylesheet" href="../../style.css">
  </head>
  
  <body>
    <h1 id="pageHeading"></h1>
    <h2 id="pageSubtitle"></h2>
  
    <table border="1">
      <tbody id="quizTable"></tbody>
    </table>
  
    <br>
    <div id="container"></div>
    <br>
  
    <a id="backLink" href="#">戻る</a>
  
    <script>
      // URLパラメータ
      const params = new URLSearchParams(location.search);
      
      const grade  = parseInt(params.get('grade'))  || 0; // 級
      const cat    = parseInt(params.get('cat'))    || 0; // 分野
      const status = parseInt(params.get('status')) || 0; // 指定理解度
      const seed   = parseInt(params.get('seed'))   || 0; // ランダムシード値
  
      // 級別設定
      const gradeConfigs = {    
        // 漢検1級
        0: {
          heading: "漢検1級勉強",
          cats: ["音読み", "訓読み", "書き取り", "書き取り-国字", "語選択", "四字熟語-書き", "四字熟語-意味", "熟字訓", "熟語-一字訓読み", "対義語・類義語", "故事成語", "文章題"],
          keys: ["result11", "result12", "result21", "NULL22", "result3", "NULL41", "NULL42", "result5", "NULL6", "NULL7", "result8", "NULL9"],
          categories: {
            0: {
              max: 4200,
              filename: "https://milchibi.github.io/data_11.csv"
            },
            1: {
              max: 1400,
              filename: "https://milchibi.github.io/data_12.csv"
            },
            2: {
              max: 558,
              filename: "https://milchibi.github.io/data_21.csv"
            },
            4: {
              max: 3786,
              filename: "https://milchibi.github.io/data_3.csv",
              selectionMode: true
            },
            7: {
              max: 2190,
              filename: "https://milchibi.github.io/data_5.csv"
            },
            10: {
              max: 2390,
              filename: "https://milchibi.github.io/data_8.csv"
            }
          }
        },
        // 漢検2級
        2: {
          heading: "漢検2級勉強",
          cats: ["読み", "部首", "熟語構成", "四字熟語-書き", "四字熟語-意味", "対義語・類義語", "同音書き", "誤字訂正", "送り仮名", "書き"],
          keys: ["result2_1", "NULL2_2", "NULL2_3", "NULL2_41", "NULL2_42", "NULL2_5", "NULL2_6", "NULL2_7", "NULL2_8", "result2_9"],
          categories: {
            0: {
              max: 20,
              filename: "https://milchibi.github.io/data2_1.csv"
            },
            8: {
              max: 20,
              filename: "https://milchibi.github.io/data2_9.csv"
            }
          }
        },
        // 漢検準2級
        3: {
          heading: "漢検準2級勉強",
          cats: ["読み", "部首", "熟語構成", "四字熟語-書き", "四字熟語-意味", "対義語・類義語", "同音書き", "誤字訂正", "送り仮名", "書き"],
          keys: ["resultP2_1", "NULLP2_2", "NULLP2_3", "NULLP2_41", "NULLP2_42", "NULLP2_5", "NULLP2_6", "NULLP2_7", "NULLP2_8", "resultP2_9"],
          categories: {
            0: {
              max: 10,
              filename: "https://milchibi.github.io/dataP2_1.csv"
            },
            8: {
              max: 10,
              filename: "https://milchibi.github.io/dataP2_9.csv"
            }
          }
        },
        // 漢検5級
        6: {
          heading: "漢検5級勉強",
          cats: ["読み", "部首", "筆順", "送り仮名", "音訓構成", "一字書き", "対義語・類義語", "熟語選択", "熟語構成", "同音書き", "書き"],
          keys: ["result5_1", "NULL5_2", "NULL5_3", "NULL5_4", "NULL5_5", "NULL5_6", "NULL5_7", "NULL5_8", "NULL5_9", "NULL5_10", "result5_11"],
          categories: {
            0: {
              max: 20,
              filename: "https://milchibi.github.io/data5_1.csv"
            },
            10: {
              max: 20,
              filename: "https://milchibi.github.io/data5_11.csv"
            }
          }
        },
        // 漢検6級
        7: {
          heading: "漢検6級勉強",
          cats: ["読み", "音訓読み分け", "選択", "筆順", "音訓識別", "対義語", "送り仮名", "部首", "同音書き", "熟語", "書き"],
          keys: ["result6_1", "NULL6_2", "NULL6_3", "NULL6_4", "NULL6_5", "NULL6_6", "NULL6_6", "NULL6_8", "NULL6_9", "NULL6_10", "result6_11"],
          categories: {
            0: {
              max: 40,
              filename: "https://milchibi.github.io/data6_1.csv"
            },
            10: {
              max: 30,
              filename: "https://milchibi.github.io/data6_11.csv"
            }
          }
        },
        // 漢検7級
        8: {
          heading: "漢検7級勉強",
          cats: ["読み", "音訓読み分け", "選択", "筆順", "音訓識別", "対義語", "送り仮名", "部首", "同音書き", "熟語", "書き"],
          keys: ["result7_1", "NULL7_2", "NULL7_3", "NULL7_4", "NULL7_5", "NULL7_6", "NULL7_7", "NULL7_8", "NULL7_9", "NULL7_10", "result7_11"],
          categories: {
            0: {
              max: 160,
              filename: "https://milchibi.github.io/data7_1.csv"
            },
            10: {
              max: 80,
              filename: "https://milchibi.github.io/data7_11.csv"
            }
          }
        },
        // 漢検8級
        9: {
          heading: "漢検8級勉強",
          cats: ["読み", "筆順", "対義語", "部首", "同音書き", "送り仮名", "音訓読み", "書き"],
          keys: ["NULL8_1", "NULL8_2", "NULL8_3", "NULL8_4", "NULL8_5", "NULL8_6", "NULL8_7", "result8_8"],
          categories: {
            7: {
              max: 40,
              filename: "https://milchibi.github.io/data8_8.csv"
            }
          }
        }
      };
      
      // gradeのチェック
      const config = gradeConfigs[grade];
      
      if (!config) {
        document.body.innerHTML = `
          <h1>エラー</h1>
          <p>対応していない級です。</p>
        `;
        throw new Error("Unsupported grade: " + grade);
      }
      
      // catの設定
      const catConfig = config.categories[cat];
      
      if (!catConfig) {
        document.body.innerHTML = `
          <h1>エラー</h1>
          <p>この級では対応していない分野です。</p>
        `;
        throw new Error("Unsupported category: grade=" + grade + ", cat=" + cat);
      }
      
      const max = catConfig.max;
      const filename = catConfig.filename;
      
      // localStorage初期化
      const KEY_STR = config.keys;

      // 現在のカテゴリのキー
      const key = KEY_STR[cat];

      if (key && !key.startsWith("NULL")) {
        let storedValue = localStorage.getItem(key);
        if (storedValue === null) {
          storedValue = "0".repeat(max);
        } else {
          storedValue = String(storedValue);
          // 短い場合は0で補う
          if (storedValue.length < max) {
            storedValue += "0".repeat(max - storedValue.length);
          }
          // 長い場合はmaxに合わせる
          if (storedValue.length > max) {
            storedValue = storedValue.substring(0, max);
          }
        }
        localStorage.setItem(key, storedValue);
      }
      
      // インデックス
      const shuffledIndex = Array.from({ length: max }, (_, i) => i);
      
      // シャッフル
      if (seed !== 0) {
        const random = mulberry32(seed);
        for (let i = shuffledIndex.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [shuffledIndex[i], shuffledIndex[j]] = [shuffledIndex[j], shuffledIndex[i]];
        }
      }
      
      // タイトル
      const catName = config.cats[cat] || "";
      const titleText = `${config.heading}　${catName}`;
      
      document.getElementById("pageTitle").textContent = titleText;
      document.getElementById("pageHeading").textContent = config.heading;
      document.getElementById("pageSubtitle").textContent = `${catName}`;
      
      // 問題欄生成
      const tbody = document.getElementById("quizTable");
      
      let statusData = localStorage
          .getItem(key)
          ?.split("")
          .map(Number) || [];
  
      // CSV読み込み
      fetch(filename)
        .then(res => {
          if (!res.ok) {
            throw new Error(`CSV読み込み失敗: ${res.status} ${filename}`);
          }
          return res.text();
        })
      
        .then(csv => {
          // CSVを配列化
          const csvData =
            csv
              .trim()
              .split("\n")
              .map(line => line.split(","));
  
          for (let i = 0; i < max; i++) {
            const index = shuffledIndex[i];
            const statusResult = statusData[index];
            if (statusResult !== status) continue;
            const row = csvData[index];
            if (!row) continue;
  
            // 表示する問題番号
            const questionNumber = i + 1;
      
            // HTML生成
            tbody.insertAdjacentHTML(
              "beforeend",
              `
                <tr>
                  <td width="52">問${questionNumber}</td>
                  <td id="txt${questionNumber}q" class="ques" colspan="2"></td>
                </tr>
          
                <tr>
                  <td class="ans">
                    <button
                      class="toggleBtn"
                      data-id="${questionNumber}">
                      解答
                    </button>
                  </td>
          
                  <td class="ans">
                    <div
                      id="txt${questionNumber}"
                      class="hidden">
                    </div>
                  </td>
          
                  <td class="ans boxCell">
                    <div
                      class="box hidden"
                      data-index="${questionNumber}">
                      ■
                    </div>
                  </td>
                </tr>
              `
            );

            // 問題
            document.getElementById(
              `txt${questionNumber}q`
            ).innerHTML = row[3];
        
            // 解答
            if (grade === 0) {
              document.getElementById(
                `txt${questionNumber}`
              ).innerHTML =
                row[4] +
                "<br><hr>" +
                row[5];
            }
            else {
              document.getElementById(
                `txt${questionNumber}`
              ).innerHTML = row[4];
            }
          }
          // 問題生成後に初期状態を反映
          draw();
        })
      
        .catch(error => {
          console.error(error);
          document.querySelector(
            "#quizTable"
          ).innerHTML = `
            <tr>
              <td colspan="3">
                問題データを読み込めませんでした。
              </td>
            </tr>
          `;
        });
      
        // 解答表示・非表示
        document.addEventListener(
          "click",
          e => {
        
            if (!e.target.classList.contains("toggleBtn")) {
              return;
            }
        
            const id = e.target.dataset.id;
            const answer = document.getElementById(`txt${id}`);
            const box =
              document.querySelector(
                `.box[data-index="${id}"]`
              );
        
            if (!answer || !box) {
              return;
            }
        
            answer.classList.toggle("hidden");
            box.classList.toggle("hidden");
          }
        );
      
        // 戻るリンク
        document.getElementById("backLink").href =
          `top.html?grade=${grade}&seed=${seed}`;
        
        // 乱数
        function mulberry32(seed) {
          return function() {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
      
        // ■の色表示
        function draw() {
          const key = KEY_STR[cat];
        
          // NULLカテゴリなどは状態管理対象外
          if (!key || key.startsWith("NULL")) {
            return;
          }
        
          const data = localStorage.getItem(key);
        
          if (!data) {
            return;
          }
        
          document
            .querySelectorAll(".box")
            .forEach(box => {
              const questionNumber = Number(box.dataset.index);
              const shuffledPosition = questionNumber - 1;
              const i = shuffledIndex[shuffledPosition];
        
              // 範囲外なら何もしない
              if (i === undefined || data[i] === undefined) {
                return;
              }
        
              // 色だけ変更
              box.classList.remove(
                "c0",
                "c1",
                "c2",
                "c3"
              );
              box.classList.add("c" + data[i]);
            });
        }
    
        // ■クリック処理
        document.addEventListener("click", e => {
          const box = e.target.closest(".box");
        
          // ■以外をクリックした場合
          if (!box) {
            return;
          }
        
          // 親要素へのクリック伝播を止める
          e.stopPropagation();
        
          const key = KEY_STR[cat];
        
          // 状態管理対象外
          if (!key || key.startsWith("NULL")) {
            return;
          }
        
          let data = localStorage
            .getItem(key)
            ?.split("");
        
          if (!data) {
            return;
          }
        
          const questionNumber = Number(box.dataset.index);
          const i = shuffledIndex[questionNumber - 1];
        
          if (i === undefined || data[i] === undefined) {
            return;
          }
        
          // 0 → 1 → 2 → 3 → 0
          data[i] = (Number(data[i]) + 1) % 4;
        
          localStorage.setItem(
            key,
            data.join("")
          );
        
          draw();
        });
    
      // 初期表示
      draw();
    
    </script>
  </body>
</html>
