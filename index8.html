<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検8級 分野別勉強</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="title">漢検8級 分野別勉強</p>
    <div><a href="index.html">一級</a></div><br>
    <div><a href="index7.html">七級</a></div><br>

    ランダム用シード値　<input type="number" id="num" name="num" min="0" max="9999" step="1" value="0" placeholder="0～9999">
    <br><br>

    <mark>(八)　書き</mark>
      <div id="status8"></div><br>
      <div id="linkContainer8"></div><br>

    <script>
      const KEY8_8 = "result8_8";
      const COUNT8 = 20;

      // 干支
      const sels = [
        "甲子","乙丑","丙寅","丁卯","戊辰","己巳","庚午","辛未","壬申","癸酉",
        "甲戌","乙亥","丙子","丁丑","戊寅","己卯","庚辰","辛巳","壬午","癸未",
        "甲申","乙酉","丙戌","丁亥","戊子","己丑","庚寅","辛卯","壬辰","癸巳",
        "甲午","乙未","丙申","丁酉","戊戌","己亥","庚子","辛丑","壬寅","癸卯",
        "甲辰","乙巳","丙午","丁未","戊申","己酉","庚戌","辛亥","壬子","癸丑",
        "甲寅","乙卯","丙辰","丁巳","戊午","己未","庚申","辛酉","壬戌","癸亥",
      ];

      // シード値付きで遷移
      function addNumParameter(link, cat, index) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const num = document.getElementById("num").value;

          if (num === "" || num < 0 || num > 9999) {
            alert("シード値には、0～9999の数値を入力してください。");
            return;
          }

          location.href = `select8.html?cat=${cat}&sel=${index}&num=${num}`;
        });
      }

      // リンク生成
      function createLinks(containerId, cat, total, unit) {
        const container = document.getElementById(containerId);

        // 必要なリンク数
        const count = Math.ceil(total / (24 * unit));

        for (let index = 0; index < count; index++) {

          const link = document.createElement("a");
          link.href = `select8.html?cat=${cat}&sel=${index}`;
          link.textContent = sels[index];

          addNumParameter(link, cat, index);

          container.appendChild(link);
          container.append("　");

          // 6個ごとに改行
          if ((index + 1) % 6 === 0) {
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));
            }
        }
      }

      // 各分野の設定
      const categories = [
        { containerId: "linkContainer8", cat: 7, total: COUNT8, unit: 10 },
      ];

      // 一括生成
      categories.forEach(category => {
        createLinks(
          category.containerId,
          category.cat,
          category.total,
          category.unit
        );
      });

      // localStorageから取得
      let val8 = localStorage.getItem(KEY8_8);
      let sts8;
      if (val8 === null){
        sts8 = "0".repeat(COUNT8);
      } else {
        sts8 = String(val8);
        if (sts8.length < COUNT8){
          sts8 += "0".repeat(COUNT8 - sts8.length);
        }
      }
      localStorage.setItem(KEY8_8, sts8);
    
      // 0,1,2,3の数を数える
      const cnt8_0 = (sts8.match(/0/g) || []).length;
      const cnt8_1 = (sts8.match(/1/g) || []).length;
      const cnt8_2 = (sts8.match(/2/g) || []).length;
      const cnt8_3 = (sts8.match(/3/g) || []).length;
    
      // 表示
      document.getElementById("status8").innerHTML = 
        '<span class="c0">⬛︎</span>' + cnt8_0 + '　<span class="c1">⬛︎</span>' + cnt8_1 + '　<span class="c2">⬛︎</span>' + cnt8_2 + '　<span class="c3">⬛︎</span>' + cnt8_3;
    </script>
  </body>
</html>
